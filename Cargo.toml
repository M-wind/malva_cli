[package]
name = "malva"
description = "A simple cli wrapper for malva."
version = "0.1.0"
edition = "2024"

[dependencies]
malva = { version = "0.15.3", features = ["config_serde"] }
serde_json = "1.0.145"
clap = { version = "4.6.1", default-features = false, features = ["derive", "std", "color", "help"] }


[profile.release]
opt-level = 3
debug = false
split-debuginfo = "packed"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
